[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brunns-row"
version = "2.2.0"
description = "Convenience wrapper for DB API and csv.DictReader rows, and similar."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Simon Brunning", email = "simon@brunningonline.net"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Testing",
]
dependencies = []
import-names = ["brunns.row"]
import-namespaces = ["brunns"]

[project.urls]
Homepage = "https://brunns-row.readthedocs.io"
Documentation = "https://brunns-row.readthedocs.io"
Repository = "https://github.com/brunns/brunns-row"
Issues = "https://github.com/brunns/brunns-row/issues"

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "brunns-matchers>=3.2",
    "contexttimer>=0.3",
    "furo>=2025.12.19",
    "pyright>=1.1.409",
    "pyhamcrest>=2.0",
    "pytest-cov>=2.5",
    "pytest>=9.0",
    "ruff>=0.15.12",
    "sphinx>=8.0",
    "sphinx-autodoc-typehints>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brunns"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/brunns/__init__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN", "D", "N813", "TD", "FIX002", "FA100", "PLR0913", "COM812", "ISC001", "A005", "FBT001", "FBT002"]
exclude = ["docs/"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N802", "PT003"]
"docs/*" = ["ERA001", "A001", "PTH", "SIM115", "INP001"]
